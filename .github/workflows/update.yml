name: Update rain.json

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Fetch Aozora
        run: |
          mkdir aozora
          cd aozora
          curl -L https://www.aozora.gr.jp/cards/000081/files/456_ruby_145.zip -o text.zip
          unzip -o text.zip

      - name: Extract Rain Sentence
        run: |
          python << 'EOF'
import json
import random
import glob
import os

rain_words = ["雨","小雨","霧雨","しとしと","降り","湿"]

sentences = []

for file in glob.glob("aozora/*.txt"):
    try:
        with open(file,encoding="shift_jis",errors="ignore") as f:
            text = f.read()
            for line in text.split("。"):
                if any(word in line for word in rain_words):
                    sentences.append(line+"。")
    except:
        pass

if sentences:
    result = {
        "sentence": random.choice(sentences),
        "author":"青空文庫",
        "work":""
    }

    os.makedirs("data",exist_ok=True)

    with open("data/rain.json","w",encoding="utf-8") as f:
        json.dump(result,f,ensure_ascii=False,indent=2)
EOF

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update rain quote" || echo "no changes"
          git push
